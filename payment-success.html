<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Successful</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8f9fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(30, 142, 62, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .icon svg { color: #1e8e3e; }
  h1 { font-size: 24px; color: #1a2e24; margin-bottom: 8px; }
  p { font-size: 15px; color: #666; line-height: 1.5; margin-bottom: 16px; }
  .status { font-size: 14px; color: #999; margin-top: 16px; }
  .spinner {
    width: 20px;
    height: 20px;
    border: 2px solid #ddd;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h1 id="title">Payment Successful</h1>
  <p id="message">Your payment has been received. Thank you!</p>
  <div class="status" id="status"></div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var sessionId = params.get('session_id');
  var isSetup = params.get('setup') === 'true';

  if (isSetup) {
    var method = params.get('method');
    var methodLabel = method === 'ach' ? 'Bank Transfer' : method === 'card' ? 'Credit Card' : '';
    document.getElementById('title').textContent = 'Auto-Pay Setup Complete' + (methodLabel ? ' — ' + methodLabel : '');
    var msg = 'Your payment method has been saved securely. Future invoices will be charged automatically.';
    if (method === 'card') {
      msg += '<br><br><span style="font-size:13px;color:#999;">A 2.9% convenience fee will be applied to each monthly charge.</span>';
    }
    document.getElementById('message').innerHTML = msg;
    return;
  }

  if (!sessionId) {
    document.getElementById('status').textContent = 'No session ID found.';
    return;
  }

  document.getElementById('status').innerHTML = '<span class="spinner"></span> Confirming payment...';

  // The backend will auto-record the payment when polled via checkStripePayment
  // This page is purely informational — the crew/admin app handles the actual recording
  setTimeout(function() {
    document.getElementById('status').textContent = 'Payment confirmed. You may close this page.';
  }, 2000);
})();
</script>
</body>
</html>
