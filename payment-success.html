<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment - Endurance Services</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #f8f9fa;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    padding: 40px;
    max-width: 480px;
    width: 100%;
    text-align: center;
  }
  .icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: rgba(30, 142, 62, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
  }
  .icon svg { color: #1e8e3e; }
  h1 { font-size: 24px; color: #1a2e24; margin-bottom: 8px; }
  p { font-size: 15px; color: #666; line-height: 1.5; margin-bottom: 16px; }
  .note { font-size: 13px; color: #999; margin-top: 12px; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h1>Thank You</h1>
  <p>Your payment has been submitted. You will receive a confirmation email from Stripe once the payment is processed.</p>
  <p class="note">If you did not complete the payment, no charge was made. You can use the link in your invoice to try again.</p>
</div>
</body>
</html>
