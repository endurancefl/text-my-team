<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Report{% endblock %}</title>
<style>
:root {
  --green: #3A5F4B;
  --green-light: #E8F0EC;
  --dark: #1A2E24;
  --gray-header: #666666;
  --light-gray: #CCCCCC;
  --contract-light-gray: #F5F5F5;
  --contract-red: #C62828;
  --before-red: #DC2626;
  --after-green: #16A34A;
  --white: #FFFFFF;
  --border: #CCCCCC;
  --info-bg: #F0F0F0;
}

@page {
  size: letter;
  margin: 40px 40px 50px 40px;

  @bottom-left {
    content: "{{ footer_text }}";
    font-family: Helvetica, Arial, sans-serif;
    font-size: 8pt;
    color: var(--gray-header);
  }

  @bottom-right {
    content: "Page " counter(page) " of " counter(pages);
    font-family: Helvetica, Arial, sans-serif;
    font-size: 8pt;
    color: var(--gray-header);
  }
}

@page cover {
  margin-top: 30px;

  @top-left { content: none; }
  @bottom-left {
    content: "{{ footer_text }}";
    font-family: Helvetica, Arial, sans-serif;
    font-size: 8pt;
    color: var(--gray-header);
  }
}

@page content {
  @top-left {
    content: element(running-header);
    font-family: Helvetica, Arial, sans-serif;
    font-size: 7pt;
    color: var(--gray-header);
  }
}

@page :first {
  @top-left { content: none; }
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Helvetica, Arial, sans-serif;
  font-size: 9pt;
  color: var(--dark);
  line-height: 1.3;
  orphans: 3;
  widows: 3;
}
</style>
{% block extra_css %}{% endblock %}
</head>
<body>
{% block running_header_content %}{% endblock %}
{% block content %}{% endblock %}
</body>
</html>
