AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: PDF generation via DocRaptor + MARVIN AI streaming

Globals:
  Function:
    Timeout: 300
    MemorySize: 2048

Resources:
  PhotoUploadBucket:
    Type: AWS::S3::Bucket
    Properties:
      LifecycleConfiguration:
        Rules:
          - Id: AutoExpireUploads
            Status: Enabled
            ExpirationInDays: 1
            Prefix: uploads/
          - Id: AutoExpirePdfs
            Status: Enabled
            ExpirationInDays: 1
            Prefix: pdfs/
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - "https://endurancefl.github.io"
              - "https://enduranceservices.github.io"
              - "http://localhost:8000"
              - "http://127.0.0.1:8000"
            AllowedMethods:
              - PUT
            AllowedHeaders:
              - Content-Type
            MaxAge: 3600

  PdfGeneratorFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Architectures:
        - x86_64
      Policies:
        - S3CrudPolicy:
            BucketName: !Ref PhotoUploadBucket
      Environment:
        Variables:
          PHOTO_BUCKET: !Ref PhotoUploadBucket
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:marvin-api-key:SecretString:key}}'
          DOCRAPTOR_API_KEY: '{{resolve:secretsmanager:docraptor-api-key:SecretString:key}}'
          DOCRAPTOR_TEST_MODE: 'true'
      Events:
        GeneratePdf:
          Type: HttpApi
          Properties:
            ApiId: !Ref PdfApi
            Path: /generate_site_report
            Method: POST
        CorsOptions:
          Type: HttpApi
          Properties:
            ApiId: !Ref PdfApi
            Path: /generate_site_report
            Method: OPTIONS
        GetUploadUrls:
          Type: HttpApi
          Properties:
            ApiId: !Ref PdfApi
            Path: /upload-urls
            Method: POST
        GetUploadUrlsCors:
          Type: HttpApi
          Properties:
            ApiId: !Ref PdfApi
            Path: /upload-urls
            Method: OPTIONS
        Marvin:
          Type: HttpApi
          Properties:
            ApiId: !Ref PdfApi
            Path: /marvin
            Method: POST
        MarvinCors:
          Type: HttpApi
          Properties:
            ApiId: !Ref PdfApi
            Path: /marvin
            Method: OPTIONS
    Metadata:
      DockerTag: latest
      DockerContext: ../
      Dockerfile: Dockerfile

  MarvinStreamFunction:
    Type: AWS::Serverless::Function
    Properties:
      Runtime: python3.12
      Handler: handler.handler
      CodeUri: ../marvin-stream/
      Architectures:
        - x86_64
      MemorySize: 2048
      Timeout: 300
      Environment:
        Variables:
          ANTHROPIC_API_KEY: '{{resolve:secretsmanager:marvin-api-key:SecretString:key}}'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          AllowOrigins:
            - "https://endurancefl.github.io"
            - "https://enduranceservices.github.io"
            - "http://localhost:8000"
            - "http://127.0.0.1:8000"
          AllowMethods:
            - "POST"
          AllowHeaders:
            - "Content-Type"
          MaxAge: 3600

  PdfApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: prod
      DisableExecuteApiEndpoint: false

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL for PDF generation
    Value: !Sub "https://${PdfApi}.execute-api.${AWS::Region}.amazonaws.com/prod/generate_site_report"
  UploadUrlsEndpoint:
    Description: API Gateway endpoint URL for pre-signed upload URLs
    Value: !Sub "https://${PdfApi}.execute-api.${AWS::Region}.amazonaws.com/prod/upload-urls"
  PhotoBucketName:
    Description: S3 bucket for temporary photo uploads
    Value: !Ref PhotoUploadBucket
  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt PdfGeneratorFunction.Arn
  MarvinStreamUrl:
    Description: MARVIN streaming Function URL
    Value: !GetAtt MarvinStreamFunctionUrl.FunctionUrl
